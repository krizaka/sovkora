# Dependabot — the Krizaka model (monthly, quiet; DEPS 2026-10-13, krizaka/.github).
# Once a month (the 1st, 06:00 Paris), ONE grouped pull request per ecosystem — every update, majors included — and at
# most one open per ecosystem. Security fixes stay on and arrive grouped apart, as soon as an advisory is published.
# The ignore rules below are decisions, not oversights: Node LTS only (22/24), PostgreSQL 16 (parity with the
# DigitalOcean databases), TypeScript 7 / ESLint 10 only once @krizaka/config supports them (krizaka/krizaka-ui#141),
# the Expo SDK pins its own toolchain, and each deferred major names its tracking issue.
# A grouped pull request is merged when CI is green; a major that breaks it gets an ignore rule here and an issue.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Paris
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
    labels: ["area:deps"]
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Paris
    groups:
      all:
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Node majors are a decision, not a bump: LTS only (22/24), moved by hand
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      # pinned by the Expo SDK (53 → 57 in PS7)
      - dependency-name: "jest-expo"
      # the Expo SDK pins TypeScript (~5.8 on SDK 53); TS 6 breaks the ts-jest suites (TS5011 rootDir)
      - dependency-name: "typescript"
        versions: [">=6"]
      # with Expo 57; krizaka/orazaka-mobile-client#15
      - dependency-name: "@testing-library/react-native"
        versions: [">=14"]
      # types of the Node LTS we run (22/24), never a non-LTS line
      - dependency-name: "@types/node"
        versions: [">=25"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels: ["area:deps"]
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
