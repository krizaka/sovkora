# The web app's pnpm settings when it is built ON ITS OWN: DigitalOcean builds apps/web alone (source_dir), so the root
# pnpm-workspace.yaml is not there. Inside the repository the root file applies; keep the two lists in step.
# The dependencies allowed to run their install scripts. Recent pnpm refuses unlisted build scripts
# (ERR_PNPM_IGNORED_BUILDS), which broke the DigitalOcean build since 2026-10-24.
# `allowBuilds` is the current key; `onlyBuiltDependencies` is kept for older pnpm versions.
allowBuilds:
  "@ast-grep/cli": true
  "@parcel/watcher": true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@krizaka/*"
  - minimatch
onlyBuiltDependencies:
  - "@ast-grep/cli"
  - "@parcel/watcher"
  - unrs-resolver
# Keep in step with the root file: minimatch 7.x-10.x has a ReDoS (GHSA); 3.x (ESLint) is outside the range.
overrides:
  "minimatch@>=7.0.0 <11.0.1": ">=11.0.1"
