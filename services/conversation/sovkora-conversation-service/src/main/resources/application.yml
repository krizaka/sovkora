# What a deployment decides; secrets from the environment (.env), no default: blank, the service does not start. Operating defaults: META-INF/sovkora/conversation-service-defaults.yml.
spring:
  application.name: sovkora-conversation-service
  threads:
    virtual:
      enabled: true  # AGENTS.md §4 — an SSE stream holds its thread for the whole exchange
  datasource: { url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orazaka_db}", username: "${SPRING_DATASOURCE_USERNAME:orazaka_app}", password: "${SPRING_DATASOURCE_PASSWORD:}" }
  rabbitmq: { host: "${RABBITMQ_HOST:localhost}", port: "${RABBITMQ_PORT:5672}", username: "${RABBITMQ_USER:guest}", password: "${RABBITMQ_PASS:}" }
  data.redis.url: ${REDIS_URL:redis://localhost:6379}
server.port: ${CONVERSATION_PORT:8080}
krizaka:
  observability: { product: sovkora, service: conversation, version: "@project.version@" }
  security.jwt.secret: ${IDENTITY_JWT_SECRET:}
  web.cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  users.client: { base-url: "${IDENTITY_URL:http://localhost:8083}", service-secret: "${IDENTITY_JWT_SECRET:}", service-name: sovkora-conversation-service }
  billing: { enabled: "${BILLING_ENABLED:false}", base-url: "${BILLING_INTERNAL_URL:http://localhost:8095}", service-secret: "${IDENTITY_JWT_SECRET:}" }
orazaka:
  core: { orchestration.enabled: "${ORCHESTRATION_ENABLED:true}", knowledge: { base-url: "${KNOWLEDGE_URL:http://localhost:8084}", service-secret: "${sovkora.security.service-token.secret}" } }
  studio: { enabled: "${STUDIO_CLIENT_ENABLED:true}", base-url: "${STUDIO_INTERNAL_URL:http://localhost:8096}", service-secret: "${sovkora.security.service-token.secret}" }
sovkora.security.service-token.secret: ${AUTH_SERVICE_TOKEN_SECRET:}
