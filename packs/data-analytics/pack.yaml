# ─────────────────────────────────────────────────────────────────────────────
# data-analytics — the first pack on the Data & Analytics shelf (orazaka-packs#16,
# orazaka discussion #174). It packages the recommender of ADR-078.
#
# Two halves with two clocks (ADR-078 §1):
# - SERVING is synchronous and lives in orazaka-knowledge-service: events, items and
#   erasures in, feeds and creator insights out, < 150 ms. That is not a Studio run (a
#   run is an asynchronous, metered saga), so the pack declares it as the API scopes a
#   buyer's service key opens — `requires.api` — and the edge enforces them.
# - DATA-DRIVEN UI (ADR-082): a CSV or JSON and a question become an A2UI v0.9 dashboard. Its figures are
#   computed by the pack's worker, never by the model (krizaka-internal#3628): job.data.facts adds the table up,
#   the model picks facts by id and explains them, job.data.dashboard checks that answer and draws it from the facts.
# - UNDERSTANDING is asynchronous and metered, so it is Studios: what a video is about
#   (a keyframe through vision, then a JSON reading) and creator suggestions the
#   creator approves.
#
# tier WORKER: the blueprints name the engine's orazaka.core.* rows and the two capabilities of
# the pack's own worker (worker/, Python, stdlib arithmetic, no provider). Users are pseudonyms (HMAC-SHA256 by the product, Loi 25): the pack
# never receives an e-mail, a name or a user id (README).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: orazaka.dev/v1
key: data-analytics
version: 1.7.0
tier: WORKER
distribution: OSS
regulatoryClass: STANDARD

requires:
  # Vision and chat completion are the engine's own; the two below are the worker's, and bill nothing on their own:
  # they add up and draw, the model step between them is the metered one.
  capabilities:
    - key: orazaka.data.table.facts
      routingKey: job.data.facts
      handlerKey: data.facts
      billableCapability: NONE
      enabled: true
      inputSchema:
        type: object
        properties:
          data: { type: string, description: "The person's table: a CSV with its header row, or a JSON. Empty when it is pasted in the question." }
          question: { type: string, description: "The question, which may hold the table." }
          language: { type: string, enum: [en, fr], description: "The language of the labels (weeks, days, months)." }
        required: [question]
      outputSchema:
        type: object
        properties:
          factsJson: { type: string, description: "Every computed figure and table, for the dashboard step." }
          facts: { type: string, description: "The same, one line each with its id, for the model." }
          hasTable: { type: boolean }
          rows: { type: integer }
        required: [factsJson, facts, hasTable, rows]
    - key: orazaka.data.table.dashboard
      routingKey: job.data.dashboard
      handlerKey: data.dashboard
      billableCapability: NONE
      enabled: true
      inputSchema:
        type: object
        properties:
          facts: { type: string, description: "factsJson of the facts step." }
          answer: { type: string, description: "The model's plan: one JSON object naming facts and tables by id." }
          retry: { type: string, description: "The model's second plan, when the first was refused." }
          question: { type: string, description: "The question: a figure it writes may be quoted back." }
          final: { type: string, enum: ["true", "false"], description: "true: fail (AnswerRefusedError) when no plan holds; false: report the refusal so the blueprint asks again." }
        required: [facts, answer]
      outputSchema:
        type: object
        properties:
          answer: { type: string, description: "The summary, then the A2UI v0.9 surface (catalog krizaka:genui/v1) drawn from the facts." }
          valid: { type: boolean }
          problems: { type: string, description: "Why the plan was refused, one line each; empty when it holds." }
        required: [answer, valid, problems]
  # The recommender's serving contract (ADR-078 §6). Identical to the edge's ApiKeyScopes
  # (tests/data-analytics.test.mjs): a scope the edge does not know grants nothing.
  api:
    service: orazaka-knowledge-service
    scopes:
      - key: reco:sync
        routes:
          - "POST /api/v1/recommendations/events"
          - "POST /api/v1/recommendations/items"
          - "POST /api/v1/recommendations/erasures"
      - key: reco:read
        routes:
          - "GET /api/v1/recommendations/for-you"
          - "GET /api/v1/recommendations/similar"
          - "GET /api/v1/recommendations/insights"
      # Product analytics (ADR-081): a product's own events in; KPIs, cohorts, funnels out.
      - key: analytics:sync
        routes:
          - "POST /api/v1/analytics/events"
          - "POST /api/v1/analytics/erasures"
      - key: analytics:read
        routes:
          - "GET /api/v1/analytics/insights"
          - "GET /api/v1/analytics/funnel"

catalog:
  categoryKey: data-analytics
  iconKey: chart
  status: PUBLISHED
  sortWeight: 40
  # The first pack on this shelf opens it (ADR-068, #45). Idempotent: an existing shelf is
  # left exactly as it is.
  category:
    iconKey: chart
    sortWeight: 70

pricing:
  priceCents: 4900   # 49 $ CA — in billing.currency (CAD)
  includedCredits: 300

studios:
  - key: data-driven-ui
    profession: general
    iconKey: chart
    pricing: PAID
    entitlementKey: studio.data-driven-ui
    status: PUBLISHED
    publisherId: orazaka
    sortWeight: 30
    blueprint: studios/data-driven-ui/blueprint.json
  - key: video-understanding
    profession: general
    iconKey: vision
    pricing: PAID
    entitlementKey: studio.video-understanding
    status: PUBLISHED
    publisherId: orazaka
    sortWeight: 20
    blueprint: studios/video-understanding/blueprint.json
  - key: creator-suggestions
    profession: creative
    iconKey: sparkles
    pricing: PAID
    entitlementKey: studio.creator-suggestions
    status: PUBLISHED
    publisherId: orazaka
    sortWeight: 10
    blueprint: studios/creator-suggestions/blueprint.json
