# Dependabot — the Krizaka model, for the one Sovkora repository (ADR-029): monthly (the 1st, 06:00 Paris), ONE grouped pull
# request per ecosystem and folder, at most one open each. Security fixes stay on and arrive grouped apart.
# The ignore rules are decisions, not oversights, carried from each app's former repository: Node LTS only (22/24),
# TypeScript 7 once @krizaka/config supports it (krizaka-ui#141), the Expo SDK pins its own React Native toolchain,
# @tanstack/* moves with @krizaka/query, and each deferred major names its reason in its app's history.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
    time: "06:00"
    timezone: Europe/Paris
  groups:
    all:
      patterns:
      - '*'
  commit-message:
    prefix: ci(deps)
  labels:
  - area:deps
  open-pull-requests-limit: 1
  cooldown:
    default-days: 7
- package-ecosystem: maven
  directory: /
  schedule:
    interval: monthly
    time: "06:00"
    timezone: Europe/Paris
  groups:
    all:
      patterns:
      - '*'
    security:
      applies-to: security-updates
      patterns:
      - '*'
  ignore:
  - dependency-name: org.testcontainers:*
    versions:
    - '>=2'
  - dependency-name: com.anthropic:*
    update-types:
    - version-update:semver-major
  commit-message:
    prefix: chore(deps)
    prefix-development: chore(deps-dev)
  labels:
  - area:deps
  open-pull-requests-limit: 1
  cooldown:
    default-days: 7
- package-ecosystem: npm
