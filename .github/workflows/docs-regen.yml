# Keeps docs/_generated fresh on pull requests: when the only thing stale is the generated docs
# (an ADR changed, a contract moved), regenerate them and push the commit onto the PR branch,
# so the `workspace` check's « docs are stale » gate never needs a human. Same-repository
# branches only (a fork gets no token); the app token makes the push start CI again.
name: Docs regenerate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: docs-regen-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    # Dependabot pull requests read no secrets (no app key): the job is skipped there, never given the key.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] the step pushes the regenerated docs with this token
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The generated docs read krizaka-java at the release sovkora-parent imports (scripts/generate-docs.mjs).
      - name: krizaka-java at the release sovkora-parent imports (a tag of a public repository, no credential)
        run: |
          version=$(sed -n 's:.*<krizaka.version>\(.*\)</krizaka.version>.*:\1:p' build/sovkora-parent/pom.xml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::krizaka.version is not a release: $version"; exit 1; }
          git -c advice.detachedHead=false clone -q --depth 1 --branch "v$version" https://github.com/krizaka/krizaka-java.git .krizaka-java

      - name: Regenerate docs/_generated
        run: node scripts/generate-docs.mjs

      - name: Push the regenerated docs when only they are stale
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- docs/_generated; then
            echo "docs/_generated is fresh."
            exit 0
          fi
          if git diff --name-only | grep -q -v '^docs/_generated/'; then
            echo "Something besides docs/_generated changed; not pushing."
            exit 0
          fi
          git config user.name "krizaka-release[bot]"
          git config user.email "krizaka-release[bot]@users.noreply.github.com"
          git add docs/_generated
          git commit -m "docs: regenerate docs/_generated"
          git push origin "HEAD:${HEAD_REF}"
