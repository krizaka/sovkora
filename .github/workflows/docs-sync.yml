# Keeps docs/_generated in step with the workspace. The generated docs read the default branches of the other
# repositories (packs, services, UI kit), so they drift when those move, not only when this repository does.
# Every day this regenerates them on a full workspace clone and, when they differ, opens or updates the pull request
# `chore/docs-sync`; the required checks then run on it like on any other change.
#
# A pull request opened with the default GITHUB_TOKEN does not start the workflows that are required on main, so the
# PR does not start CI by itself: the last step dispatches CI on the branch (workflow_dispatch), whose checks land on the PR head commit. No extra token.
name: docs-sync

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  sync:
    # Write scopes live on the job, not at the top level (Scorecard TokenPermissions).
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # zizmor: ignore[artipacked] the step pushes a bot branch with the persisted token
        with:
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      # The generated docs read krizaka-java at the release sovkora-parent imports (scripts/generate-docs.mjs).
      - name: krizaka-java at the release sovkora-parent imports (a tag of a public repository, no credential)
        run: |
          version=$(sed -n 's:.*<krizaka.version>\(.*\)</krizaka.version>.*:\1:p' build/sovkora-parent/pom.xml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::krizaka.version is not a release: $version"; exit 1; }
          git -c advice.detachedHead=false clone -q --depth 1 --branch "v$version" https://github.com/krizaka/krizaka-java.git .krizaka-java

      - name: Regenerate the docs
        run: node scripts/generate-docs.mjs

      - name: Open or update the pull request when the docs drifted
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN || github.token }}
        run: |
          if git diff --quiet -- docs/_generated; then
            echo "docs/_generated is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/docs-sync
          git add docs/_generated
          git commit -m "docs: regenerate docs/_generated (the workspace moved)"
          git push --force origin chore/docs-sync  # bot-owned branch: rebuilt from main every run
          if gh pr list --repo "$GITHUB_REPOSITORY" --head chore/docs-sync --state open --json number --jq '.[0].number' | grep -q .; then
            echo "pull request already open: updated by the push"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head chore/docs-sync \
              --title "docs: regenerate docs/_generated (the workspace moved)" \
              --body "Daily sync: the generated docs differ from the default branches of the workspace repositories. Generated by .github/workflows/docs-sync.yml; only docs/_generated changes."
          fi
          # Merged by itself once its checks are green: the docs must not wait for a person while every other PR goes red.
          gh pr merge chore/docs-sync --repo "$GITHUB_REPOSITORY" --auto --squash || true
          # A PR opened or updated with GITHUB_TOKEN starts no workflow. A workflow_dispatch run of CI on the branch
          # reports its checks on the same commit, which is what the required check "workspace" reads: no extra token.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref chore/docs-sync
