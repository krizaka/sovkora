# The one pipeline of Sovkora (ADR-029: one repository). Each part runs when a path it reads changed (krizaka/.github
# changes.yml, fail-open: a broken gate runs everything), and always on main, merge_group, the nightly and dispatch:
#   java     the Maven reactor: a pull request tests the changed modules and their dependents, the queue tests everything
#   web / mobile / cli   the clients of the pnpm workspace, each with its own lockfile
#   media    the Python media worker (uv)          packs   the packs: schema, goldens and their Python workers
#   scripts  the repository tooling, the layout and naming guards, the generated docs, the infra format
#   sonar    ONE SonarCloud project (krizaka_sovkora), fed with every part's coverage
# The required check is `workspace`: it is green only when every part that had to run passed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # nightly: everything, on main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── what changed ────────────────────────────────────────────────────────────────────────────────────────────────
  java-changes:
    uses: krizaka/.github/.github/workflows/changes.yml@a9b7d9371790abb5b71bc40028f747e876752e66 # main
    with:
      # packs/ too: the studio's bundle tests read the shipped packs.
      relevant: '^(pom\.xml|\.mvn/|mvnw(\.cmd)?$|build/|contracts/|engine/|services/|e2e/|packs/|infra/(initdb|migrations|users|brokers-infra|docker-compose)|modules\.json$|scripts/(ci-plan|check-skipped-tests|check-krizaka-versions)\.mjs$|scripts/lib/(skipped-tests|krizaka-versions)\.mjs$|scripts/skipped-tests-allowlist\.json$|\.github/workflows/ci\.yml$)'
  web-changes:
    uses: krizaka/.github/.github/workflows/changes.yml@a9b7d9371790abb5b71bc40028f747e876752e66 # main
    with:
      relevant: '^(apps/web/|packs/|docs/|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$)'
  mobile-changes:
    uses: krizaka/.github/.github/workflows/changes.yml@a9b7d9371790abb5b71bc40028f747e876752e66 # main
    with:
      relevant: '^(apps/mobile/|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$)'
  cli-changes:
    uses: krizaka/.github/.github/workflows/changes.yml@a9b7d9371790abb5b71bc40028f747e876752e66 # main
    with:
      relevant: '^(apps/cli/|packs/pack\.schema\.json$|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$)'

  # ── Java ────────────────────────────────────────────────────────────────────────────────────────────────────────
  java:
    name: Java reactor
    needs: java-changes
    if: ${{ !cancelled() && needs.java-changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2 # HEAD^1 = the base of the pull request's merge commit (the plan)
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: The com.krizaka versions are on the repository our builds publish to
        env:
          ARTIFACT_REPOSITORY_URL: ${{ vars.ARTIFACT_REPOSITORY_URL }}
        run: node scripts/check-krizaka-versions.mjs
      # The platform bootstrap and the Krizaka services Sovkora runs beside its own (users, billing) are krizaka-java's: the
      # integration tests read them from a checkout of the release sovkora-parent imports (the dev image builds the same).
      - name: krizaka-java at the release sovkora-parent imports (a tag of a public repository, no credential)
        run: |
          version=$(sed -n 's:.*<krizaka.version>\(.*\)</krizaka.version>.*:\1:p' build/sovkora-parent/pom.xml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::krizaka.version is not a release: $version"; exit 1; }
          git -c advice.detachedHead=false clone -q --depth 1 --branch "v$version" https://github.com/krizaka/krizaka-java.git .krizaka-java
      - name: Plan (what this event must test)
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: node scripts/ci-plan.mjs --event "$EVENT" --diff HEAD^1
      - name: Build and test every module
        if: ${{ steps.plan.outputs.mode == 'full' }}
        run: ./mvnw -B -ntp -T 4 install
      - name: Build every module (the changed ones are tested next)
        if: ${{ steps.plan.outputs.mode == 'changed' }}
        run: >
          ./mvnw -B -ntp -T 4 install -DskipTests -DskipITs
          -Dspotbugs.skip=true -Dpmd.skip=true -Dcpd.skip=true -Dspotless.check.skip=true -Djacoco.skip=true
      - name: Test the changed modules and their dependents
        if: ${{ steps.plan.outputs.mode == 'changed' && steps.plan.outputs.pl != '' }}
        env:
          MODULES: ${{ steps.plan.outputs.pl }}
        run: ./mvnw -B -ntp verify -pl "$MODULES" -amd
      - name: No integration test skipped itself
        if: ${{ steps.plan.outputs.mode == 'full' }}
        run: |
          set -euo pipefail
          node -e 'for (const m of require("./modules.json").modules) if (m.kind === "maven") console.log(m.path + " " + m.name)' |
            while read -r dir name; do node scripts/check-skipped-tests.mjs "$dir" "$name"; done
      - name: The test counts, per module
        if: ${{ always() }}
        run: node scripts/test-counts.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the coverage and classes for SonarCloud
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-java
          if-no-files-found: ignore
          retention-days: 1
          path: |
            **/target/site/jacoco/jacoco.xml
            **/target/classes/**
            **/target/test-classes/**

  # ── the clients ─────────────────────────────────────────────────────────────────────────────────────────────────
  web:
    name: Web app
    needs: web-changes
    if: ${{ !cancelled() && needs.web-changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - run: npm install -g pnpm@12.10.1
      - name: Install (its own lockfile)
        run: pnpm install --frozen-lockfile --filter .
      - name: Validate (lint, rules, scripts, tests with coverage)
        run: pnpm run validate
      - name: Build
        run: pnpm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: coverage-web
          if-no-files-found: ignore
          retention-days: 1
          path: apps/web/coverage/lcov.info

  mobile:
    name: Mobile app
    needs: mobile-changes
    if: ${{ !cancelled() && needs.mobile-changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - run: npm install -g pnpm@12.10.1
      - name: Install (its own lockfile)
        run: pnpm install --frozen-lockfile --filter .
      - name: Validate (lint, types, tests with coverage, links, icons, flows, names)
        run: pnpm run validate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: coverage-mobile
          if-no-files-found: ignore
          retention-days: 1
          path: apps/mobile/coverage/lcov.info

  cli:
    name: CLI
    needs: cli-changes
    if: ${{ !cancelled() && needs.cli-changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - run: npm install -g pnpm@12.10.1
      - name: Install (its own lockfile)
        run: pnpm install --frozen-lockfile --filter .
      - name: Validate (lint, dependencies, build, tests with coverage)
        run: pnpm run validate
      - name: What npm users get (pack both tarballs, install them outside the repository, run the bin)
        run: pnpm run test:pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: coverage-cli
          if-no-files-found: ignore
          retention-days: 1
          path: apps/cli/coverage/lcov.info

  # ── Python ──────────────────────────────────────────────────────────────────────────────────────────────────────
  media:
    name: Media worker
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/python-ci.yml@a9b7d9371790abb5b71bc40028f747e876752e66 # main
    with:
      relevant: '^(workers/media/|apps/cli/src/services/image-model-recipes\.json$|\.github/workflows/ci\.yml$)'
      working-directory: workers/media
      extra-packages: pytest pyyaml pika Pillow psutil cryptography numpy coverage
      # The sound suites render through ffmpeg; the runner image may not carry it.
      setup-command: command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
      # Every suite of the worker (test_main's runner guard fails on one left out): no GPU, no model; the CUDA host's suites
      # skip themselves where ffmpeg lacks a filter.
      test-command: >
        python -m coverage run -m pytest -q test_capability_contract.py test_gpu_runtime.py test_image_to_video.py
        test_cut.py test_deliver.py test_foley.py test_mixer.py test_titles.py test_voice_direction.py
        test_remote_video.py test_sound_models.py
        test_main.py test_measure.py test_model_cache.py test_upscale.py test_sound_handler.py test_stages.py
        test_job_control.py test_ltx_video.py test_sound.py test_consumer_resilience.py test_cinematic_kit.py
        test_gpu_out.py test_hosted_worker.py test_speech_server.py test_spend.py test_dockerfile_pins.py
        test_failure_answer.py
        && python -m coverage xml -o coverage.xml

  packs-schema:
    name: Packs (schema, goldens)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # golden exceptions are compared with the immutable base of the pull request
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          package-manager-cache: false
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm test
        env:
          GOLDEN_BASE_SHA: ${{ github.event.pull_request.base.sha }}

  # The pack workers, one shared python-ci each (a list command opens with set -euo pipefail: only the last status counted).
  packs-workers:
    name: Pack worker
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: document-validation/worker
            packages: pypdf pika pyyaml pikepdf reportlab Pillow pytest
            tests: test_rules.py test_golden.py test_authenticity.py test_authenticity_formats.py test_forensics.py test_screening.py test_identify.py test_check.py test_regex_safety.py test_derivation.py test_lecture.py test_failure_answer.py
          - worker: message-authenticity/worker
            packages: pika pyyaml pytest
            tests: test_authenticity.py
          - worker: media-safety/worker
            packages: pika pyyaml pytest
            tests: test_safety.py
          - worker: echo-toolkit/worker
            packages: pika pyyaml pytest
            tests: test_echo_worker.py
          - worker: tenant-screening-qc/worker
            packages: pika pyyaml pytest
            tests: test_screening.py
          - worker: identity-document-check/worker
            packages: pika pyyaml pytest
            tests: test_mrz.py test_rules.py test_worker.py
          - worker: worker-common
            packages: pika pytest
            tests: test_worker_broker.py test_worker_loop.py test_worker_failure.py
          - worker: profile-photo-check/worker
            requirements: packs/profile-photo-check/requirements.txt
            packages: pytest
            setup: python fetch_models.py
            tests: test_rules.py test_faces.py test_worker.py
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/python-ci.yml@a9b7d9371790abb5b71bc40028f747e876752e66 # main
    with:
      relevant: '^(packs/|\.github/workflows/ci\.yml$)'
      working-directory: packs/${{ matrix.worker }}
      requirements: ${{ matrix.requirements || '' }}
      extra-packages: ${{ matrix.packages }}
      setup-command: ${{ matrix.setup || '' }}
      test-command: python -m pytest -q ${{ matrix.tests }}

  # ── the repository's own tooling ────────────────────────────────────────────────────────────────────────────────
  scripts:
    name: Repository tooling, layout and docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Repository layout
        uses: krizaka/.github/actions/repo-layout@a9b7d9371790abb5b71bc40028f747e876752e66 # main
      # The tests and the generated docs read krizaka-java at the release sovkora-parent imports (billing migrations, building blocks).
      - name: krizaka-java at the release sovkora-parent imports (a tag of a public repository, no credential)
        run: |
          version=$(sed -n 's:.*<krizaka.version>\(.*\)</krizaka.version>.*:\1:p' build/sovkora-parent/pom.xml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::krizaka.version is not a release: $version"; exit 1; }
          git -c advice.detachedHead=false clone -q --depth 1 --branch "v$version" https://github.com/krizaka/krizaka-java.git .krizaka-java
      - name: Script tests (with the layout and naming guards of ADR-029)
        timeout-minutes: 10 # these tests take seconds: a hang is a bug, not a slow run
        run: |
          mkdir -p coverage
          node --test --test-timeout=120000 --experimental-test-coverage \
            --test-coverage-exclude='scripts/test/**' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=coverage/lcov.info \
            'scripts/test/*.test.mjs'
      - name: The retired code names only fall (docs/NAMING.md)
        run: node scripts/check-code-names.mjs
      - name: The Java layout (ADR-029 N3, N4)
        run: node scripts/check-java-layout.mjs
      - name: No self-referencing Java constants
        run: |
          if git grep -P 'static\s+final\s+[\w<>]+\s+(\w+)\s*=\s*\1\s*;'; then
            echo "::error::Self-referencing static final constants found — the field initialises to null at runtime."
            exit 1
          fi
      - name: Docs are generated from this code
        run: node scripts/generate-docs.mjs --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: coverage-scripts
          if-no-files-found: ignore
          retention-days: 1
          path: coverage/lcov.info

  infra-format:
    name: OpenTofu format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: latest
          tofu_wrapper: false
      - name: tofu fmt -check
        run: tofu fmt -check -recursive infra

  # ── one SonarCloud project ──────────────────────────────────────────────────────────────────────────────────────
  # The required « SonarCloud Code Analysis » is posted by the SonarCloud app once this scan has run, on every event the
  # required checks run on, merge_group included (krizaka-internal#2000). It reads the coverage of every part that ran.
  sonar:
    name: SonarCloud
    needs: [java, web, mobile, cli, scripts]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: The token is there
        run: |
          if [ -z "$SONAR_TOKEN" ]; then echo "::error::SONAR_TOKEN is empty: it is an org secret (a Dependabot secret too)"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # blame and new-code detection need the history
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
      - uses: krizaka/.github/actions/sonar-scan@a9b7d9371790abb5b71bc40028f747e876752e66 # main
        with:
          token: ${{ secrets.SONAR_TOKEN }}
          args: -Dsonar.qualitygate.wait=true

  # ── the gate ────────────────────────────────────────────────────────────────────────────────────────────────────
  workspace:
    name: workspace
    # Not `sonar`: its red on old debt is not the product's code and never freezes the repository (krizaka-internal#2598).
    needs: [java, web, mobile, cli, media, packs-schema, packs-workers, scripts, infra-format]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every part that had to run passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          bad = {name: job["result"] for name, job in json.load(sys.stdin).items() if job["result"] not in ("success", "skipped")}
          for name, result in bad.items(): print(f"::error::{name}: {result}")
          sys.exit(1 if bad else 0)'

  # Main must not go red unnoticed: a failed run on main files one issue in the private krizaka-internal (never in this
  # public repository, krizaka-internal#2267); a second red run comments on it.
  red-main:
    needs: workspace
    if: ${{ always() && needs.workspace.result == 'failure' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: What failed
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          echo "CI failed on main at ${SHA:0:7}: ${RUN_URL}" > "$RUNNER_TEMP/body.md"
      - uses: krizaka/.github/actions/alert-issue@a9b7d9371790abb5b71bc40028f747e876752e66 # main
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          title: "sovkora · fix(ci): main is red"
          body-file: ${{ runner.temp }}/body.md
          labels: repo:sovkora,type:fix
