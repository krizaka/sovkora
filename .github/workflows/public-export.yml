name: Public export
# CI builds Sovkora's public static export (apps/web `pnpm build:public`) and checks it (krizaka-internal#4625, parent #4148): the routes
# against public-build/routes.mjs, then the shared guard of @krizaka/config (`krizaka-export-guard`). It reports on merge_group too.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  public-export:
    name: Public export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - run: npm install -g pnpm@12.10.1
      - name: Install (its own lockfile)
        run: pnpm install --frozen-lockfile --filter .
      - name: Build the export (one project per language)
        run: pnpm build:public
      - name: Check the export with the shared guard
        run: pnpm check:public
