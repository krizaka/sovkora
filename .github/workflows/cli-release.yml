# The Sovkora CLI on npm (apps/cli, package `sovkora`, krizaka-internal#3935): published only from here, never from a laptop.
# A `cli-v<version>` tag publishes the version of apps/cli/package.json with provenance (npm trusted publishing: the OIDC
# token of this job; NPM_TOKEN only authenticates the first publish, before npm knows the trusted publisher of the new name).
# A manual run with `deprecate` set marks the retired packages as renamed; they are never unpublished.
name: CLI release

on:
  push:
    tags: ["cli-v*"]
  pull_request:
    paths: [".github/workflows/cli-release.yml", "apps/cli/**"]
  workflow_dispatch:
    inputs:
      deprecate:
        description: "Deprecate @krizaka/orazaka-cli and orazaka (renamed: use sovkora). Never unpublishes."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  publish:
    name: publish sovkora
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/cli/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: npm 11 (trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10)
        run: npm install -g --ignore-scripts npm@11.21.1
      - name: The tag is the version of the package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          if [ "$TAG" != "cli-v$version" ]; then echo "::error::tag $TAG does not match apps/cli/package.json version $version"; exit 1; fi
      - run: pnpm install --frozen-lockfile --filter .
        working-directory: apps/cli
      - run: pnpm run lint
        working-directory: apps/cli
      - run: pnpm test
        working-directory: apps/cli
      - name: What npm users get (the packed tarball, installed in an empty project)
        run: pnpm run test:pack
        working-directory: apps/cli
      - name: Publish
        run: npm publish --provenance --access public
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  dry-run:
    name: publish dry run (pnpm resolves, the tarball packs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/cli/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter .
        working-directory: apps/cli
      - run: npm publish --dry-run --access public
        working-directory: apps/cli

  deprecate:
    name: deprecate the retired packages
    if: github.event_name == 'workflow_dispatch' && inputs.deprecate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Deprecate (a deprecation is a message; the versions stay installable)
        run: |
          npm deprecate "@krizaka/orazaka-cli" "renamed: use sovkora"
          npm deprecate "orazaka" "renamed: use sovkora"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
