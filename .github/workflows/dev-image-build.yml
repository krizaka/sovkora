# Builds the dev `core` image (infra/deploy/Dockerfile) when a pull request touches what it is made from, and weekly on
# main, so a broken image is caught here and never as a failed deployment on sovkora-dev. Nothing is pushed.
name: Dev image build

on:
  pull_request:
    paths:
      - "infra/deploy/Dockerfile"
      - "infra/deploy/run-services.sh"
      - "infra/deploy/*.app.yaml"
      - "infra/compute-nodes/Dockerfile.worker"
      - "build/sovkora-parent/pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "pom.xml"
      - ".dockerignore"
      - ".github/workflows/dev-image-build.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-image-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build the core image (no push)
        run: docker build --progress=plain --build-arg "CORE_REBUILD=ci-${GITHUB_RUN_ID}" -f infra/deploy/Dockerfile -t sovkora-core:ci .
