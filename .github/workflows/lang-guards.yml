# Rust guards of the org (krizaka-internal#2115): rustfmt, clippy pedantic counted in lang-ratchet.json (debt only goes down),
# cargo-deny, tests under a timeout. Reusable workflow of krizaka/.github, pinned by sha.
name: lang-guards

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lang-guards-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/rust-quality.yml@84a22e72359caf315d8bf346f4a31cdb22f25997 # main
    with:
      working-directory: apps/desktop/src-tauri
      runs-on: macos-latest
      prepare: node ../scripts/build-sidecar.mjs
      timeout-minutes: 30

  # The Tauri-free crates the Mac app depends on (krizaka-internal#4344): macOS, so the Seatbelt checks run instead of skipping.
  rust-crates:
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/rust-quality.yml@84a22e72359caf315d8bf346f4a31cdb22f25997 # main
    with:
      working-directory: crates
      runs-on: macos-latest
      timeout-minutes: 30

  python-media:
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/python-quality.yml@84a22e72359caf315d8bf346f4a31cdb22f25997 # main
    with:
      working-directory: workers/media
      paths: "."
      timeout-minutes: 15

  python-packs:
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/python-quality.yml@84a22e72359caf315d8bf346f4a31cdb22f25997 # main
    with:
      working-directory: packs
      paths: "."
      timeout-minutes: 15
