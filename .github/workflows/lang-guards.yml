# Rust guards of the org (krizaka-internal#2115): rustfmt, clippy pedantic counted in lang-ratchet.json (debt only goes down),
# cargo-deny, tests under a timeout. Reusable workflow of krizaka/.github, pinned by sha.
name: lang-guards

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lang-guards-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/rust-quality.yml@d58e10b1c64ceda9ed2e7a2e1fe868d8b163ae73 # main
    with:
      working-directory: apps/desktop/src-tauri
      runs-on: macos-latest
      prepare: node ../scripts/build-sidecar.mjs
      timeout-minutes: 30

  python-media:
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/python-quality.yml@d58e10b1c64ceda9ed2e7a2e1fe868d8b163ae73 # main
    with:
      working-directory: workers/media
      paths: "."
      timeout-minutes: 15

  python-packs:
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/python-quality.yml@d58e10b1c64ceda9ed2e7a2e1fe868d8b163ae73 # main
    with:
      working-directory: packs
      paths: "."
      timeout-minutes: 15
