# ONE SonarCloud project for the one Sovkora repository (ADR-029). CI's sonar job downloads every part's coverage and the
# compiled Java classes before it scans (.github/workflows/ci.yml).
sonar.projectKey=krizaka_sovkora
sonar.organization=krizaka
sonar.sources=build,contracts,engine,services,apps/web/src,apps/mobile/src,apps/cli/src,apps/desktop/src,workers/media,workers/reader,packs,scripts
sonar.tests=build,contracts,engine,services,e2e,apps,workers/media,workers/reader,packs,scripts/test
sonar.test.inclusions=**/src/test/**,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.test.mjs,**/*.spec.ts,**/test_*.py,scripts/test/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/target/**,**/coverage/**,docs/_generated/**,**/src/test/**,**/__tests__/**,**/*.test.*,**/test_*.py,apps/desktop/src-tauri/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.wav,**/*.pdf
sonar.sourceEncoding=UTF-8
# Binary fixtures (images, audio, PDFs) are not source: scanned as UTF-8 text they raise the encoding warning.
sonar.test.exclusions=**/*.png,**/*.jpg,**/*.jpeg,**/*.wav,**/*.pdf
sonar.java.source=21
# The dependency jars the java job copies (dependency:copy-dependencies), uploaded with the classes.
sonar.java.libraries=sonar-libs/*.jar
sonar.java.test.libraries=sonar-libs/*.jar
# The migrations are PostgreSQL, not Oracle: the PL/SQL analyzer (which wants a data dictionary) gets no file.
sonar.plsql.file.suffixes=.sovkora-none
sonar.java.binaries=**/target/classes
sonar.java.test.binaries=**/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=lcov-web.info,lcov-mobile.info,lcov-cli.info,lcov-scripts.info
sonar.python.coverage.reportPaths=coverage-py-media.xml,coverage-py-reader.xml,coverage-py-packs.xml
sonar.python.version=3.12
