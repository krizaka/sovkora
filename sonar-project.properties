# ONE SonarCloud project for the one Sovkora repository (ADR-029). CI's sonar job downloads every part's coverage and the
# compiled Java classes before it scans (.github/workflows/ci.yml).
sonar.projectKey=krizaka_sovkora
sonar.organization=krizaka
sonar.sources=build,contracts,engine,services,apps/web/src,apps/mobile/src,apps/cli/src,apps/desktop/src,workers/media,packs,scripts
sonar.tests=build,contracts,engine,services,e2e,apps,workers/media,packs,scripts/test
sonar.test.inclusions=**/src/test/**,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.test.mjs,**/*.spec.ts,**/test_*.py,scripts/test/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/target/**,**/coverage/**,docs/_generated/**,**/src/test/**,**/__tests__/**,**/*.test.*,**/test_*.py,apps/desktop/src-tauri/**
sonar.java.source=21
sonar.java.binaries=**/target/classes
sonar.java.test.binaries=**/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
# Every part's report is downloaded under coverage-reports/ and rewritten with repository-relative paths by
# scripts/prepare-sonar-coverage.mjs, which fails the scan when a part passed without one.
sonar.javascript.lcov.reportPaths=coverage-reports/normalized/*.lcov.info
sonar.python.coverage.reportPaths=coverage-reports/normalized/*.coverage.xml
sonar.python.version=3.12
