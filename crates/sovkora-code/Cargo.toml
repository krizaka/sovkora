[package]
name = "sovkora-code"
version = "0.1.0"
description = "Sovkora's code agent core: the granted repository, the visibility filter and redactor, the read tools, per-hunk diffs, sandboxed checks and the agent loop. No Tauri."
authors = ["Krizaka"]
edition = "2021"
license = "FSL-1.1-ALv2"
rust-version = "1.80"
publish = false

[dependencies]
krizaka-rust = { version = "0.4.0", git = "https://github.com/krizaka/krizaka-rust", tag = "v0.4.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
# token redaction and exact per-hunk diffs (ADR-093)
regex = "1"
similar = "3"
# checks: kill the whole process group of a timed-out run
libc = "0.2"

[dev-dependencies]
tempfile = "3"
