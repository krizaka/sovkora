# The clients of Sovkora, one pnpm workspace (ADR-029). Each app keeps its own lockfile, so a dependency bump in one
# app never moves another app's pins; `pnpm -r` and `pnpm --filter` run them together or one by one.
packages:
  - apps/web
  - apps/mobile
  - apps/cli
  - apps/desktop

sharedWorkspaceLockfile: false

# A flat node_modules per app, as npm lays it out: React Native's Metro and the jest-expo preset resolve and transform
# packages by their node_modules path, which pnpm's isolated layout (.pnpm/...) defeats.
nodeLinker: hoisted

# The dependencies allowed to run their install scripts. Recent pnpm refuses unlisted build scripts
# (ERR_PNPM_IGNORED_BUILDS), which broke the DigitalOcean build of the web app on 2026-10-24.
allowBuilds:
  "@ast-grep/cli": true
  "@parcel/watcher": true
  unrs-resolver: true
onlyBuiltDependencies:
  - "@ast-grep/cli"
  - "@parcel/watcher"
  - unrs-resolver

# Krizaka's own packages are installed as soon as they are published (the release-age rule is for third parties).
# minimatch is excluded because the override above bumps it explicitly as a security fix (GHSA ReDoS).
minimumReleaseAgeExclude:
  - "@krizaka/*"
  - minimatch

# pnpm 12 reads overrides only from here (the "overrides" / "pnpm.overrides" of an app's package.json are ignored).
# minimatch 7.x-10.x is pulled by dev tooling and has a ReDoS (GHSA); 3.x (ESLint) is outside the range and untouched.
overrides:
  "minimatch@>=7.0.0 <11.0.1": ">=11.0.1"
  # zod 3.x is pulled by @krizaka/orazaka-shared (zod ^3), glob 13.x by a dev-tooling parent: both ranges are vulnerable
  # (GHSA-mrhx-c7xc-m3w5, glob >= 9 <= 14.0.1). Remove when orazaka-shared declares zod ^4 and the glob parent bumps.
  "zod@<4.6.6": ">=4.6.6"
  "glob@>=9.0.0 <14.0.2": ">=14.0.2"
